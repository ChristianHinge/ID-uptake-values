[project]
name = "ID-uptake-values"
version = "0.3.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christian Hinge", email = "christian.hinge@regionh.dk" }
]
requires-python = ">=3.12"
dependencies = [
    "argparse>=1.4.0",
    "matplotlib>=3.11.2",
    "nibabel>=5.4.2",
    "scipy>=1.18.1",
]

[project.scripts]
suv_id = "id_uptake_values.suv:main"
sul_id = "id_uptake_values.sul:main"

[build-system]
requires = ["uv_build>=0.8.16,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "huggingface-hub>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
